<script id="data" type="application/json">{"1028": {"title": "215學習平台 — 1028小考詳解", "source": "試卷來源：1028_高二小考.pdf（Class 215考卷）", "sections": [{"name": "I. Vocabulary_A（文意字彙與詞類變化：10%，每題 1%）", "parts": [], "questions": [{"number": 1, "part": "", "question": "Because the young patient was nervous about the medical procedure, the nurse allowed her mother to a_______y her into the examination room.", "answer": "accompany", "explanation": "空格位於不定詞 to 之後、受詞 her 之前（allow + O + to + V），需填入原形及物動詞。前半句提到年幼病患對醫療程序感到緊張，因此護理師允許母親「陪同」她進入診療室，結合字首 a 與字尾 y 填入 accompany。", "vocab": "accompany (v.) 陪伴；陪同（搭配：accompany sb. to/into + 地點）\nmedical procedure (n. phr.) 醫療程序；手術步驟\nexamination room (n. phr.) 診療室；檢查室"}, {"number": 2, "part": "", "question": "Getting enough sleep and drinking plenty of water are e_______l habits if you want to stay healthy during flu season.", "answer": "essential", "explanation": "空格位於連綴動詞 are 之後、名詞 habits 之前，需填入形容詞。充足睡眠與多喝水對於在流感季節保持健康是「必要的、極其重要的」習慣，結合字首 e 與字尾 l 填入 essential。", "vocab": "essential (adj.) 必要的；極其重要的；本質的\nplenty of (phr.) 大量的；充足的\nflu season (n. phr.) 流感季節"}, {"number": 3, "part": "", "question": "The family rarely gathered at the restaurant, but their grandparents' fiftieth wedding anniversary was a special o_______n worth celebrating.", "answer": "occasion", "explanation": "空格前有冠詞與形容詞 a special，後有形容詞片語 worth celebrating 修飾，需填入單數可數名詞。祖父母五十週年結婚紀念日是值得慶祝的「特別場合／時刻」，結合字首 o 與字尾 n 填入 occasion。", "vocab": "occasion (n.) 場合；重大慶典；時機\nwedding anniversary (n. phr.) 結婚紀念日\nbe worth + V-ing (phr.) 值得……的"}, {"number": 4, "part": "", "question": "If you leave ice cream out on the counter on a hot summer afternoon, it is i_______e that it will completely melt.", "answer": "inevitable", "explanation": "此句為 It is + adj. + that S + V 句型，空格需填入形容詞。在炎熱夏日午後把冰淇淋放在流理台上，完全融化是「不可避免的、必然的」，結合字首 i 與字尾 e 填入 inevitable。", "vocab": "inevitable (adj.) 不可避免的；必然發生的\ncounter (n.) 流理台；櫃檯\ncompletely melt (v. phr.) 完全融化"}, {"number": 5, "part": "", "question": "Every December, our company hosts its a_______l dinner to celebrate the team's achievements over the past year.", "answer": "annual", "explanation": "空格位於所有格 its 與名詞 dinner 之間，需填入形容詞。由 Every December（每年十二月）與 over the past year（過去一年來）可知為一年一度的「年度」晚宴，結合字首 a 與字尾 l 填入 annual。", "vocab": "annual (adj.) 每年的；一年一度的\nhost (v.) 主辦；舉辦\nachievement (n.) 成就；成績"}, {"number": 6, "part": "", "question": "Drivers who wear seat belts can often e_______e serious injury in traffic accidents.", "answer": "escape", "explanation": "空格位於助動詞 can 與頻率副詞 often 之後、受詞 serious injury 之前，需填入原形及物動詞。繫安全帶的駕駛在車禍中常能「逃過、免於」嚴重傷害，結合字首 e 與字尾 e 填入 escape。", "vocab": "escape (v.) 逃脫；逃避、免於（搭配：escape injury / death）\nseat belt (n. phr.) 安全帶\nserious injury (n. phr.) 嚴重傷害；重傷"}, {"number": 7, "part": "", "question": "After dedicating thirty years of hard work to the local hospital, the doctor finally received public _______ (recognize) at the town council meeting.", "answer": "recognition", "explanation": "空格位於及物動詞 received 與形容詞 public 之後，需填入動詞 recognize 的名詞形式 recognition（public recognition 公開表揚）。", "vocab": "recognition (n.) 表揚；認可；承認\ndedicate... to + N/V-ing (v. phr.) 將（時間、精力）奉獻給……\ntown council (n. phr.) 鎮議會；市政委員會"}, {"number": 8, "part": "", "question": "The boy bears such a striking _______ (resemble) to his father that people immediately know they are related just by looking at their smiles.", "answer": "resemblance", "explanation": "空格前有冠詞與形容詞 a striking，後接介系詞 to，構成固定搭配 bear a striking resemblance to sb.（與某人極為神似），故將動詞 resemble 轉為名詞 resemblance。", "vocab": "resemblance (n.) 相似；相像（bear a striking resemblance to... 與……極為神似）\nstriking (adj.) 顯著的；驚人的；引人注目的"}, {"number": 9, "part": "", "question": "When the visitors walked into the clinic, the front-desk _______ (receive) greeted them politely and checked them in for their appointments.", "answer": "receptionist", "explanation": "空格前有 the front-desk（櫃檯的），且後方動作 greeted them politely 與 checked them in 是由人所執行，故須將動詞 receive 轉為指人的職務名詞 receptionist（接待員、櫃檯人員）。", "vocab": "receptionist (n.) 接待員；櫃檯人員\ncheck sb. in (v. phr.) 為某人辦理報到（或入住）手續"}, {"number": 10, "part": "", "question": "When choosing an apartment, she had a strong _______ (prefer) for units on higher floors because she wanted more natural light and less street noise.", "answer": "preference", "explanation": "空格前有冠詞與形容詞 a strong，後接介系詞 for，構成固定片語 have a strong preference for...（對……有強烈偏好），故將動詞 prefer 轉為名詞 preference。", "vocab": "preference (n.) 偏好；偏愛\nunit (n.) （公寓大樓的）一戶，單位住房"}]}, {"name": "II. Vocabulary_B（選詞填空：15%，每題 1%）", "parts": [{"name": "", "intro": ["名詞 (n.)：(A) texture 質地、口感 / (B) slots 名額、空檔（複數） / (C) illusion 錯覺、幻覺 / (D) admission 入學許可、入場費 / (O) grant 補助金（亦作原形動詞「准予」）", "動詞與片語 (v. / v. phr.)：(E) blurs the line 模糊界線（單數現在式） / (F) polished 潤飾、擦亮（過去式/分詞） / (G) mashed 搗碎（過去式/分詞） / (I) plunged 驟降、暴跌（過去式/分詞） / (L) disclose 揭露、透露（原形） / (M) dragged on 拖延（過去式） / (N) pioneered 開創、率先採用（過去式/分詞） / (O) grant 准予、核准（原形）", "形容詞 (adj.)：(H) enormous 巨大的 / (J) incredible 極好的、難以置信的 / (K) fragile 易碎的、脆弱的"]}], "questions": [{"number": 1, "part": "", "question": "When winter came and the icy wind blew in, the temperature _______ from 20°C to below freezing in just a few hours.", "answer": "(I) plunged", "explanation": "主詞為 the temperature，後接從 20°C 在幾小時內降到冰點以下，需填過去式不及物動詞表「驟降」，故選 (I) plunged。另一過去式不及物片語 (M) dragged on（拖延）與「短短幾小時內急劇降溫」語意不合；(F)、(G)、(N) 則為及物動詞且語意無關。", "vocab": "plunge (v.) 驟降，暴跌；below freezing (phr.) 冰點以下。"}, {"number": 2, "part": "", "question": "Even though he had never cooked before, the dinner he made tasted so _______ that everyone at the table asked for a second plate.", "answer": "(J) incredible", "explanation": "連綴動詞 tasted 與程度副詞 so 後需填形容詞（so + adj. + that...）。每個人都要求再來一盤，可見晚餐嚐起來「極棒、好得令人難以置信」，故選 (J) incredible。(H) enormous（巨大的）與 (K) fragile（易碎的）皆無法形容食物嚐起來的美味程度。", "vocab": "incredible (adj.) 極好的，難以置信的；ask for a second plate (v. phr.) 要求再來一盤。"}, {"number": 3, "part": "", "question": "Please wrap those glass cups carefully with thick bubble wrap because they are very _______ and will break if dropped.", "answer": "(K) fragile", "explanation": "空格位於 are very 之後，需填形容詞。用厚氣泡紙包裹玻璃杯且「摔落就會破掉（will break if dropped）」，直接對應「易碎的」，故選 (K) fragile。(H) enormous 與 (J) incredible 無法解釋為何摔落會破。", "vocab": "fragile (adj.) 易碎的，脆弱的；bubble wrap (n. phr.) 氣泡紙。"}, {"number": 4, "part": "", "question": "After months of hard study and passing the strict entrance exam, David finally received his letter of _______ to the university.", "answer": "(D) admission", "explanation": "通過嚴格入學考試後收到的是大學「入學許可信（letter of admission to the university）」，且 admission 後固定搭配介系詞 to，故選 (D) admission。(A) texture（口感）、(C) illusion（錯覺）、(O) grant（補助金）皆不構成 letter of ___ to the university。", "vocab": "admission (n.) 入學（或入場）許可；entrance exam (n. phr.) 入學考試。"}, {"number": 5, "part": "", "question": "The company promised to keep the secret project quiet, so the manager refused to _______ any details to the news reporters.", "answer": "(L) disclose", "explanation": "refused to 後需填原形及物動詞。公司承諾保密（keep the secret project quiet），因此經理拒絕向記者「揭露、透露」細節，故選 (L) disclose。另一原形動詞 (O) grant（准予、核准）搭配 details to the news reporters 語意不通。", "vocab": "disclose (v.) 揭露，透露；keep... quiet (v. phr.) 對……保密。"}, {"number": 6, "part": "", "question": "Before submitting her English essay to the teacher, Lisa carefully _______ her sentences to fix grammar errors and choose better words.", "answer": "(F) polished", "explanation": "為了修正文法錯誤並選擇更好的字詞，Lisa 在交出作文前仔細「潤飾、修改」句子，需填過去式及物動詞 (F) polished。(G) mashed（搗碎）用於食物，(N) pioneered（開創）語意不合。", "vocab": "polish (v.) 潤飾（文章），擦亮；submit (v.) 繳交，提交。"}, {"number": 7, "part": "", "question": "The cooking workshop is very popular and only has room for twenty people, so you should sign up early before all the _______ are taken.", "answer": "(B) slots", "explanation": "all the ... are taken 需要複數名詞作主詞。工作坊僅容納二十人，應提早報名以免所有「名額」被搶光，故選字庫中唯一的複數名詞 (B) slots。", "vocab": "slot (n.) 名額，空檔，時段；sign up (v. phr.) 報名。"}, {"number": 8, "part": "", "question": "The small clinic _______ the use of online video appointments in the town, long before larger hospitals started doing it.", "answer": "(N) pioneered", "explanation": "由 long before larger hospitals started doing it（遠在大型醫院開始這麼做之前）可知小診所「率先開創、倡導」線上視訊看診，故選 (N) pioneered。(F) polished 與 (G) mashed 無「首創」之意。", "vocab": "pioneer (v.) 開創，率先使用 / (n.) 先驅。"}, {"number": 9, "part": "", "question": "The large wall mirrors in the tiny café create the _______ that the dining space is twice as big as it really is.", "answer": "(C) illusion", "explanation": "大面牆鏡讓小咖啡館看起來比實際大兩倍，這是營造出視覺上的「錯覺（create the illusion that...）」，故選 (C) illusion。(A) texture、(D) admission、(O) grant 皆無法接此同位語子句。", "vocab": "illusion (n.) 錯覺，幻覺；twice as big as... (phr.) 是……的兩倍大。"}, {"number": 10, "part": "", "question": "We expected the staff meeting to end in thirty minutes, but it _______ for nearly three hours because no one could agree.", "answer": "(M) dragged on", "explanation": "原本預期三十分鐘結束，但因無人達成共識而「拖延、冗長持續」了將近三小時，需填過去式不及物動詞片語 (M) dragged on。(I) plunged（驟降）語意不符。", "vocab": "drag on (v. phr.) 拖延，冗長地持續。"}, {"number": 11, "part": "", "question": "To make smooth baby food, she boiled the sweet potatoes until they were soft and then _______ them with a fork.", "answer": "(G) mashed", "explanation": "將地瓜煮軟後用叉子「搗碎、壓成泥」以製作綿密的嬰兒副食品，故選 (G) mashed。(F) polished 與 (N) pioneered 不適用於食材處理。", "vocab": "mash (v.) 把……搗成泥；boil (v.) 水煮。"}, {"number": 12, "part": "", "question": "Freshly baked bread usually has a crispy brown crust on the outside and a soft, fluffy _______ on the inside.", "answer": "(A) texture", "explanation": "外層是酥脆外皮（crust），內層則是柔軟蓬鬆的「質地／口感」，故選 (A) texture。(C) illusion、(D) admission、(O) grant 皆與食物口感無關。", "vocab": "texture (n.) 質地，口感；crispy (adj.) 酥脆的；crust (n.) 麵包皮；fluffy (adj.) 蓬鬆的。"}, {"number": 13, "part": "", "question": "Because the student had an urgent family emergency, the school principal decided to _______ him two days of leave.", "answer": "(O) grant", "explanation": "decided to 後接雙受詞 him two days of leave（他兩天假），需填原形授與動詞表「准予、核准」，故選 (O) grant。(L) disclose（揭露）語意不合且不可接雙受詞。", "vocab": "grant (v.) 准予，核准；leave (n.) 休假，准假。"}, {"number": 14, "part": "", "question": "Remote working from home often _______ between office hours and personal life, making it hard to stop thinking about tasks at night.", "answer": "(E) blurs the line", "explanation": "動名詞主詞 Remote working from home 為單數，搭配現在式頻率副詞 often 與後方的 between office hours and personal life，構成固定片語 blur the line between A and B（模糊 A 與 B 之間的界線），故選 (E) blurs the line。", "vocab": "blur the line between A and B (v. phr.) 模糊 A 與 B 之間的界線。"}, {"number": 15, "part": "", "question": "When we reached the top of the hill, we saw several _______ elephants that towered over us and easily knocked down trees with their trunks.", "answer": "(H) enormous", "explanation": "高聳於我們之上（towered over us）且能用象鼻輕易推倒樹木，可見大象體型「巨大的、龐大的」，故選 (H) enormous。(K) fragile（易碎的）與句意相反，(J) incredible 不如 enormous 直接呼應體型高大的描寫。", "vocab": "enormous (adj.) 巨大的，龐大的；tower over... (v. phr.) 高聳於……之上；trunk (n.) 象鼻，樹幹。"}]}, {"name": "III. Cloze（綜合測驗：20%，每題 2%）", "parts": [{"name": "第一篇（第 1–5 題：德奧背包客鐵道之旅）", "intro": []}, {"name": "第二篇（第 6–10 題：餐廳環境心理學與消費行為）", "intro": []}], "questions": [{"number": 1, "part": "第一篇（第 1–5 題：德奧背包客鐵道之旅）", "question": "My first stop was Munich, a city 1 old stone architecture and a lively street culture sit comfortably side by side.", "answer": "(A) where", "explanation": "先行詞為地點名詞 a city，後方子句主詞為 old stone architecture and a lively street culture，動詞 sit 為完全不及物動詞，子句結構完整不缺主詞或受詞，故須用關係副詞 (A) where（= in which）。(B) which 與 (D) that 為關係代名詞，後方子句須缺主詞或受詞；(C) when 用於修飾時間先行詞。", "vocab": "set off (v. phr.) 出發；architecture (n.) 建築；side by side (phr.) 並肩地，並存地。"}, {"number": 2, "part": "第一篇（第 1–5 題：德奧背包客鐵道之旅）", "question": "An electric boat carried us across the glassy water, mountains 2 sharply on both sides.", "answer": "(B) rising", "explanation": "逗號前已是完整子句，逗號後無連接詞且帶有獨立主詞 mountains，為獨立分詞構句（原為 as mountains rose sharply on both sides）。不及物動詞 rise（聳立、升起）與主詞 mountains 為主動關係，故用現在分詞 (B) rising。(A) risen 為過去分詞（不及物動詞無被動）；(C) rose 為過去式動詞，缺少連接詞會造成逗號誤接（comma splice）；(D) to rise 表目的或未來動作，不符當下景觀描寫。", "vocab": "pristine (adj.) 原始純淨的；tucked inside... (phr.) 隱匿於……之中；glassy (adj.) 如鏡面般平靜的。"}, {"number": 3, "part": "第一篇（第 1–5 題：德奧背包客鐵道之旅）", "question": "Midway through, the captain raised a trumpet and played a short tune. The clear notes 3 the rock faces, producing distinct echoes that lingered across the water.", "answer": "(D) bounced off", "explanation": "音符（The clear notes）撞擊岩壁（the rock faces）後產生清晰回音（producing distinct echoes），物理上是從岩壁「反彈、反射回來」，故選 (D) bounced off。(A) settled down（安頓、平息）與 (B) faded out（漸弱、淡出）皆為不及物片語，不可直接加受詞且不會產生清晰回音；(C) blended into（融入）多指外觀融入背景，無法解釋聲音反射形成回音。", "vocab": "bounce off (v. phr.) 從……反彈；fade out (v. phr.) 漸弱，淡出；blend into (v. phr.) 融入；distinct (adj.) 清晰的，明顯不同的；linger (v.) 迴盪，逗留。"}, {"number": 4, "part": "第一篇（第 1–5 題：德奧背包客鐵道之旅）", "question": "After visiting the historic salt mine in Hallstatt, I continued eastward to Vienna by train. The landscape 4 as we moved along, trading alpine peaks for flatter ground surrounding the capital.", "answer": "(A) shifted", "explanation": "後方分詞構句 trading alpine peaks for flatter ground（由高山山峰變為首都周圍較平坦的地形）說明隨著火車前進，窗外地貌景觀隨之「轉變、變化」，故選 (A) shifted。(B) vanished（消失）、(C) expanded（擴張）、(D) collapsed（崩塌）皆與風景由高山轉為平原不符。", "vocab": "shift (v./n.) 轉變，轉移；vanish (v.) 消失；collapse (v.) 倒塌，瓦解；trade A for B (v. phr.) 把 A 換成 B。"}, {"number": 5, "part": "第一篇（第 1–5 題：德奧背包客鐵道之旅）", "question": "Traveling by train kept the entire journey seamless, allowing each departure to feel like a natural extension of wherever I had just been, 5 a jarring interruption to the trip.", "answer": "(C) rather than", "explanation": "「剛去過之處的自然延伸（a natural extension...）」與「對旅程突兀的中斷（a jarring interruption...）」語意相反，表示「是 A 而不是（而非）B」，故選 (C) rather than。(A) in case of（萬一）表條件預防；(B) in spite of（儘管）表讓步，與無縫銜接矛盾；(D) so as to（為了）後須接原形動詞而非名詞片語。", "vocab": "seamless (adj.) 無縫的；extension (n.) 延伸；rather than (phr.) 而不是；jarring (adj.) 突兀的，刺耳的。"}, {"number": 6, "part": "第二篇（第 6–10 題：餐廳環境心理學與消費行為）", "question": "Indeed, restaurants 6 a variety of subtle psychological strategies to shape your dining experience and your spending.", "answer": "(C) draw on", "explanation": "餐廳「運用、憑藉」各種微妙的心理學策略來塑造用餐體驗與消費，故選 (C) draw on。(A) look into（調查）、(B) pick up（撿起、偶然學會）、(D) cope with（應付困難）語意皆不合。", "vocab": "draw on / upon (v. phr.) 運用，憑藉；look into (v. phr.) 調查；cope with (v. phr.) 應付，處理；layout (n.) 格局，配置；subtle (adj.) 微妙的，巧妙的。"}, {"number": 7, "part": "第二篇（第 6–10 題：餐廳環境心理學與消費行為）", "question": "Fast-food giants deliberately choose red and yellow because warm colors stimulate appetite and encourage diners to eat quickly. 7, cool shades like blue suppress hunger, which is why they are seldom seen in dining areas.", "answer": "(A) In contrast", "explanation": "前句講「暖色系（紅、黃）刺激食慾」，本句講「冷色調（藍色）抑制飢餓感」，兩者為正反對比關係，故選 (A) In contrast（相反地、相比之下）。(B) As a result 表因果、(C) For instance 表舉例、(D) In addition 表同向遞進，皆無法呈現正反對立。", "vocab": "in contrast (phr.) 相反地；deliberately (adv.) 刻意地；stimulate appetite (v. phr.) 刺激食慾；suppress hunger (v. phr.) 抑制飢餓感。"}, {"number": 8, "part": "第二篇（第 6–10 題：餐廳環境心理學與消費行為）", "question": "Studies reveal that slow-tempo background music causes diners to linger and spend up to 40 percent more on beverages 8.", "answer": "(A) than they do when fast-paced music is played", "explanation": "本段探討「音樂節奏快慢（Music tempo）」，且空格前有比較級 spend up to 40 percent more on beverages，需要連接詞 than 引導比較對象（慢節奏背景音樂 vs. 快節奏音樂），助動詞 do 代替前面的動詞 spend，故選 (A)。(B) 偏離音樂主題且無比較結構；(C) more 不可接 as；(D) 與前文慢節奏音樂重複且缺 than。", "vocab": "tempo (n.) 節奏，速度；environmental cue (n. phr.) 環境線索；acoustic manipulation (n. phr.) 聽覺操控；patron (n.) 顧客；unwind (v.) 放鬆。"}, {"number": 9, "part": "第二篇（第 6–10 題：餐廳環境心理學與消費行為）", "question": "This acoustic manipulation subtly prompts patrons to unwind and order another round without glancing at the clock. 9, loud and energetic music speeds up consumption, helping fast-food venues turn tables rapidly during rush hours.", "answer": "(A) By contrast", "explanation": "前兩句說明「慢節奏音樂」讓顧客放鬆久留並多點飲料；本句說明「大聲且充滿活力的快節奏音樂」加快進食速度、幫助速食店快速翻桌，形成對比，故選 (A) By contrast。(B) Meanwhile 表同時發生；(C) Therefore 與 (D) Consequently 表因果關係。", "vocab": "by contrast (phr.) 相較之下，相反地；turn tables (v. phr.) 翻桌（讓下一批客人入座）。"}, {"number": 10, "part": "第二篇（第 6–10 題：餐廳環境心理學與消費行為）", "question": "While fast-food chairs are designed to create slight physical discomfort after twenty minutes, fine dining establishments 10 with plush seating that invites customers to stay and indulge.", "answer": "(C) do the opposite", "explanation": "While 引出對比：速食店椅子設計成坐二十分鐘後會產生輕微不適，而高級餐廳則配備舒適豪華座椅（plush seating）邀請顧客久留享受，做法與速食店「正好相反」，故選 (C) do the opposite。(A) do without（沒有……也行）、(B) take control（掌控）、(D) make matters worse（使情況更糟）語意皆不符。", "vocab": "do the opposite (v. phr.) 採取相反做法；fine dining establishment (n. phr.) 高級餐廳；plush (adj.) 豪華舒適的；indulge (v.) 盡情享受。"}]}, {"name": "IV. Fill-in-gaps（文意選填：15%，每題 1%）", "parts": [{"name": "第一篇（第 1–10 題：爆紅的尖叫岩蹄兔 Rock Hyrax）", "intro": ["名詞 (n.)：(A) scale 規模（亦作原形動詞「攀登」） / (E) connections 關聯、親緣關係（複數） / (J) spots 斑點、地點（亦作單數動詞「發現」）", "動詞與片語 (v. / v. phr.)：(A) scale 攀登（原形） / (B) recognized 認可（過去分詞/形容詞「知名的」） / (C) designed 設計（過去分詞） / (D) warn away 警告驅離（原形） / (H) depends on 仰賴（單數現在式） / (J) spots 發現、看見（單數現在式）", "形容詞與副詞 (adj. / adv.)：(B) recognized 知名的 / (F) dramatic 戲劇性的、誇張驚人的 / (G) alike 同樣地、兩者皆然（副詞） / (I) varied 多樣化的"]}, {"name": "第二篇（第 11–15 題：能量飲料的提神假象與健康風險）", "intro": ["(A) wear off (v. phr.) （藥效、刺激物等）逐漸消退（複數/原形不及物動詞片語）", "(B) signals (n., pl. / v., 3rd sing.) 訊號；發訊號", "(C) quality (adj. / n.) 優質的、高品質的；品質", "(D) catch (n. / v.) 隱患、陷阱、背後的問題（單數名詞）；抓住", "(E) costs (n., pl. / v., 3rd sing.) 成本、代價；花費", "(F) promises (v., 3rd sing. / n., pl.) 承諾、號稱能（搭配 promise to + V）", "(G) risks (n., pl. / v., 3rd sing.) 風險、危害（搭配 pose ... risks）"]}], "questions": [{"number": 1, "part": "第一篇（第 1–10 題：爆紅的尖叫岩蹄兔 Rock Hyrax）", "question": "As videos of the small mammal’s (1) _______ cries quickly spread across social media, viewers were astonished by how such an ordinary-looking creature could produce such piercing sounds.", "answer": "(F) dramatic", "explanation": "所有格與名詞 cries 之間需填形容詞。呼應前文「叫得如此大聲」與後文「發出如此刺耳的聲音（piercing sounds）」，形容其叫聲「極具戲劇性的、誇張驚人的」，選 (F) dramatic。(I) varied（多樣化的）留於第 7 題搭配 a wider range of notes and patterns。", "vocab": "dramatic (adj.) 戲劇性的，誇張驚人的；sensation (n.) 轟動一時的人事物；astonished (adj.) 驚訝的；piercing (adj.) 刺耳的。"}, {"number": 2, "part": "第一篇（第 1–10 題：爆紅的尖叫岩蹄兔 Rock Hyrax）", "question": "However, its feet are uniquely (2) _______ for climbing.", "answer": "(C) designed", "explanation": "are uniquely ___ for climbing 構成被動結構 be designed for + V-ing（構造上專為……而設計／適合……），故選 (C) designed。", "vocab": "be designed for... (phr.) 專為……而設計；at first glance (phr.) 乍看之下。"}, {"number": 3, "part": "第一篇（第 1–10 題：爆紅的尖叫岩蹄兔 Rock Hyrax）", "question": "With soft, rubbery pads that remain moist and act like suction cups, the animal can (3) _______ steep cliffs with remarkable ease.", "answer": "(A) scale", "explanation": "助動詞 can 後、受詞 steep cliffs（陡峭懸崖）前需填原形及物動詞。藉由像吸盤般的腳墊，牠能輕易「攀登、爬上」陡峭懸崖，故選 (A) scale。(D) warn away 受詞須為競爭對手而非懸崖。", "vocab": "scale (v.) 攀登，爬上；suction cup (n. phr.) 吸盤；with remarkable ease (phr.) 極為輕易地。"}, {"number": 4, "part": "第一篇（第 1–10 題：爆紅的尖叫岩蹄兔 Rock Hyrax）", "question": "Furthermore, the hyrax holds another biological secret that surprises scientists and nature enthusiasts (4) _______.", "answer": "(G) alike", "explanation": "置於兩個並列名詞 scientists and nature enthusiasts 之後，構成 A and B alike（A 與 B 兩者皆然／同樣地），故選副詞 (G) alike。", "vocab": "A and B alike (phr.) A 與 B 同樣地；enthusiast (n.) 熱愛者。"}, {"number": 5, "part": "第一篇（第 1–10 題：爆紅的尖叫岩蹄兔 Rock Hyrax）", "question": "Although it weighs only a few kilograms, DNA studies reveal that it is closely related to elephants, representing one of the natural world’s most startling family (5) _______.", "answer": "(E) connections", "explanation": "one of + 最高級 + 複數名詞，且前文指出蹄兔與大象有近親關係（closely related to elephants），代表自然界最令人驚奇的家族「親緣關係／連結」之一，故選 (E) connections。", "vocab": "connection (n.) 關聯，親緣關係；startling (adj.) 令人震驚的。"}, {"number": 6, "part": "第一篇（第 1–10 題：爆紅的尖叫岩蹄兔 Rock Hyrax）", "question": "During breeding season, males produce complex sounds to attract mates and (6) _______ rivals.", "answer": "(D) warn away", "explanation": "and 連接兩個並列不定詞 to attract mates and (to) ___ rivals，雄性發出複雜聲音是為了吸引配偶並「警告驅離」競爭對手，故選 (D) warn away。", "vocab": "warn away (v. phr.) 警告驅離；breeding season (n. phr.) 繁殖季節；rival (n.) 競爭對手。"}, {"number": 7, "part": "第一篇（第 1–10 題：爆紅的尖叫岩蹄兔 Rock Hyrax）", "question": "Research shows that as males mature, their songs become longer and more (7) _______, including a wider range of notes and patterns, and thus more appealing to females.", "answer": "(I) varied", "explanation": "longer and more ___ 需填形容詞，後方 including a wider range of notes and patterns（包含更廣泛的音符與節奏型態）直接說明歌聲變得更「多樣化、富於變化」，故選 (I) varied。", "vocab": "varied (adj.) 多樣化的，富於變化的；mature (v./adj.) 成熟；appealing (adj.) 吸引人的。"}, {"number": 8, "part": "第一篇（第 1–10 題：爆紅的尖叫岩蹄兔 Rock Hyrax）", "question": "In daily life, surviving on rough ground heavily (8) _______ the group’s careful watch.", "answer": "(H) depends on", "explanation": "動名詞片語主詞 surviving on rough ground 為單數，搭配副詞 heavily 與受詞 the group's careful watch，表示生存高度「仰賴、取決於」群體的警戒守望，故選 (H) depends on。", "vocab": "depend on (v. phr.) 仰賴，取決於。"}, {"number": 9, "part": "第一篇（第 1–10 題：爆紅的尖叫岩蹄兔 Rock Hyrax）", "question": "The instant a lookout (9) _______ a predator, it sounds an alarm, allowing the entire group to dash into narrow rock crevices safely.", "answer": "(J) spots", "explanation": "The instant（一……就……）引導時間副詞子句，單數主詞 a lookout（哨兵）一「發現、看見」掠食者（a predator）就會發出警報，故選單數及物動詞 (J) spots。", "vocab": "spot (v.) 發現，看見；the instant + S + V (conj.) 一……就……；lookout / sentinel (n.) 哨兵；crevice (n.) 狹窄裂縫。"}, {"number": 10, "part": "第一篇（第 1–10 題：爆紅的尖叫岩蹄兔 Rock Hyrax）", "question": "The rock hyrax has attracted human interest for thousands of years, but it was not until recently that it became globally (10) _______.", "answer": "(B) recognized", "explanation": "became globally ___ 需填形容詞／過去分詞，表示直到最近牠才因網路爆紅而「享譽全球、被全球認識」，故選 (B) recognized。", "vocab": "globally recognized (adj. phr.) 全球知名的；It was not until... that... (句型) 直到……才……。"}, {"number": 11, "part": "第二篇（第 11–15 題：能量飲料的提神假象與健康風險）", "question": "For many exhausted students, this brightly colored beverage (11) _______ to power them through demanding late-night study sessions.", "answer": "(F) promises", "explanation": "單數主詞 this brightly colored beverage 後接不定詞 to power them through...，選項中唯有 (F) promises 可構成 promise to + V（承諾／號稱能幫助他們撐過深夜苦讀）。", "vocab": "promise to + V (v. phr.) 承諾做……，號稱能……；beverage (n.) 飲料；demanding (adj.) 繁重的，費力的。"}, {"number": 12, "part": "第二篇（第 11–15 題：能量飲料的提神假象與健康風險）", "question": "Nevertheless, the real (12) _______ is the inevitable crash that follows.", "answer": "(D) catch", "explanation": "the real ___ 後接單數動詞 is，故必須填單數名詞（排除複數名詞 signals, costs, risks）。前文講提神效果，此處轉折指出「真正的**隱患／背後問題（the real catch）**是隨之而來不可避免的精力崩潰」，故選 (D) catch。", "vocab": "catch (n.) 隱藏的問題，陷阱（the real catch 真正的問題所在）；crash (n.) 精力崩潰。"}, {"number": 13, "part": "第二篇（第 11–15 題：能量飲料的提神假象與健康風險）", "question": "Once the stimulating chemicals (13) _______, you often end up feeling even more fatigued, anxious, and irritable.", "answer": "(A) wear off", "explanation": "複數主詞 the stimulating chemicals（刺激性化學物質）後無受詞，需填複數現在式不及物動詞片語。一旦刺激物質的藥效「消退、退去」，反而會感到更疲倦焦慮，故選 (A) wear off。", "vocab": "wear off (v. phr.) （藥效、刺激物等）逐漸消退；end up + V-ing (v. phr.) 最終變成……；fatigued (adj.) 疲憊的；irritable (adj.) 易怒的。"}, {"number": 14, "part": "第二篇（第 11–15 題：能量飲料的提神假象與健康風險）", "question": "Over time, frequent consumption disrupts your natural biorhythms and makes it considerably harder to achieve (14) _______ sleep.", "answer": "(C) quality", "explanation": "名詞 sleep 前需填形容詞修飾，quality sleep 為固定搭配，意為「優質睡眠、高品質睡眠」，故選 (C) quality。", "vocab": "quality sleep (n. phr.) 優質睡眠；disrupt (v.) 擾亂；biorhythm (n.) 生理節律。"}, {"number": 15, "part": "第二篇（第 11–15 題：能量飲料的提神假象與健康風險）", "question": "After all, who knows whether those quick boosts may pose significant long-term (15) _______?", "answer": "(G) risks", "explanation": "動詞 pose（構成、造成）與形容詞 significant long-term 後需填複數名詞，pose significant long-term risks（構成重大的長期風險）為固定搭配，故選 (G) risks。(B) signals 與 (E) costs 皆不與動詞 pose 搭配。", "vocab": "pose risks (v. phr.) 構成風險；warrant (v.) 值得（考量）；artificial stimulant (n. phr.) 人工刺激物。"}]}], "answerTable": [["大題", "題號與標準答案"], ["I. Vocabulary_A (10%)", "1. accompany / 2. essential / 3. occasion / 4. inevitable / 5. annual / 6. escape / 7. recognition / 8. resemblance / 9. receptionist / 10. preference"], ["II. Vocabulary_B (15%)", "1. (I) plunged / 2. (J) incredible / 3. (K) fragile / 4. (D) admission / 5. (L) disclose / 6. (F) polished / 7. (B) slots / 8. (N) pioneered / 9. (C) illusion / 10. (M) dragged on / 11. (G) mashed / 12. (A) texture / 13. (O) grant / 14. (E) blurs the line / 15. (H) enormous"], ["III. Cloze (20%)", "1. (A) / 2. (B) / 3. (D) / 4. (A) / 5. (C) / 6. (C) / 7. (A) / 8. (A) / 9. (A) / 10. (C)"], ["IV. Fill-in-gaps (15%)", "1. (F) dramatic / 2. (C) designed / 3. (A) scale / 4. (G) alike / 5. (E) connections / 6. (D) warn away / 7. (I) varied / 8. (H) depends on / 9. (J) spots / 10. (B) recognized / 11. (F) promises / 12. (D) catch / 13. (A) wear off / 14. (C) quality / 15. (G) risks"]]}, "1022": {"title": "215學習平台 — 1022小考詳解", "source": "試卷來源：1022_高二小考.pdf（Class 215考卷）\n註：第一大題 Dictation（聽寫）與第四大題 Listening（聽力測驗）為課堂音檔施測，不列入文字詳解。", "sections": [{"name": "II. Vocabulary（選詞填空：30%，每題 2%）", "parts": [{"name": "", "intro": ["名詞 (n.)：(A) workout 鍛鍊、健身 / (D) departure 出發、啟程、起飛 / (E) fatigue 疲勞、勞累 / (L) placement 放置、擺設 / (N) disorder 失調、失序、疾病", "動詞與片語 (v. / v. phr.)：(B) set aside 撥出（時間/金錢） / (F) cushion 緩衝、減輕衝擊（亦作名詞「靠墊」） / (G) draw upon 運用、調用（知識/經驗） / (K) wear off （藥效等）消退、失效 / (O) indulge 犒賞自己、縱情享受（搭配 indulge oneself with）", "形容詞 (adj.)：(C) profitable 有利可圖的（誘答未選） / (H) exhausted 筋疲力竭的 / (I) subtle 隱約的、微小的、微妙的 / (J) inevitable 不可避免的、必然的 / (M) compact 小型緊湊的、精巧不佔空間的 / (P) rewarding 有回報的、值得做的"]}], "questions": [{"number": 1, "part": "", "question": "The airport announced that our flight's ________ would be delayed by two hours because of the heavy snowstorm, so we had to wait at the boarding gate.", "answer": "(D) departure", "explanation": "空格位於所有格 our flight's 之後，需填名詞。因為大暴雪，機場宣佈班機的「起飛／出發（departure）」將延誤兩小時，故選 (D) departure。(A) workout、(E) fatigue、(L) placement、(N) disorder 皆無法與 flight 搭配表示班機起飛。", "vocab": "departure (n.) 出發，離開，起飛（反義詞：arrival）；boarding gate (n. phr.) 登機門。"}, {"number": 2, "part": "", "question": "The twin sisters looked almost identical, but there were ________ differences in the shape of their eyes that only their parents could notice.", "answer": "(I) subtle", "explanation": "空格修飾名詞 differences，需填形容詞。雙胞胎姊妹外表看似一模一樣（almost identical），但眼型有只有父母能注意到的「隱約的、極微小的」差異，故選 (I) subtle。(H) exhausted（筋疲力竭）、(J) inevitable（必然的）、(P) rewarding（有回報的）語意皆不符。", "vocab": "subtle (adj.) 微妙的，隱約的，不易察覺的；identical (adj.) 完全相同的。"}, {"number": 3, "part": "", "question": "The interior designer carefully planned the ________ of the sofa and desks so that the living room had plenty of walking space and looked tidy.", "answer": "(L) placement", "explanation": "室內設計師仔細規劃沙發與書桌的「位置安排／擺設（placement）」，使客廳有充裕走動空間且看起來整潔，需填名詞 (L) placement。(D) departure 與 (N) disorder 語意無關。", "vocab": "placement (n.) 放置，配置，位置安排；interior designer (n. phr.) 室內設計師；tidy (adj.) 整齊的。"}, {"number": 4, "part": "", "question": "The thick grass in the park helped to ________ Leo's fall when he slipped off his bike, so he didn't get hurt.", "answer": "(F) cushion", "explanation": "helped to 後接受詞 Leo's fall，需填原形及物動詞。公園厚實的草地有助於「緩衝、減輕」跌落的衝擊力道，使他沒有受傷，故選 (F) cushion（cushion sb.'s fall 緩衝某人的摔落）。其餘動詞片語 (B)、(G)、(K)、(O) 皆無法搭配 fall。", "vocab": "cushion (v.) 緩衝，減輕……的打擊；(n.) 坐墊，靠墊；slip off (v. phr.) 從……滑落。"}, {"number": 5, "part": "", "question": "After studying hard for the final exams all week, Emily decided to ________ herself with a large cup of hot chocolate and a movie night.", "answer": "(O) indulge", "explanation": "decided to 後接反身受詞 herself 與介系詞 with，需填原形及物動詞。期末考苦讀一整週後，Emily 決定用熱可可與電影之夜來「犒賞／放縱」自己，固定搭配為 indulge oneself with sth.，故選 (O) indulge。", "vocab": "indulge (v.) 縱情享受，犒賞（搭配：indulge oneself with/in...）；hot chocolate (n. phr.) 熱巧克力。"}, {"number": 6, "part": "", "question": "To solve the difficult puzzle in the science competition, the students had to ________ their knowledge from past physics classes.", "answer": "(G) draw upon", "explanation": "had to 後接受詞 their knowledge，需填原形動詞片語。為了解開競賽難題，學生必須「調用、運用（draw upon）」過去物理課學過的知識，故選 (G) draw upon。(B) set aside（撥出、保留）與 (K) wear off（消退）語意不合。", "vocab": "draw upon / on (v. phr.) 運用，調用，憑藉（知識、經驗等）；puzzle (n.) 難題，謎題。"}, {"number": 7, "part": "", "question": "Mark often lies awake until sunrise because he suffers from a sleep ________ that makes it hard to fall asleep naturally.", "answer": "(N) disorder", "explanation": "suffers from a sleep ___，需填名詞。因為患有「睡眠障礙／失調（sleep disorder）」，導致他經常清醒躺到日出且難以自然入睡，故選 (N) disorder。(E) fatigue 為不可數名詞且不常與不定冠詞 a 連用構成 a sleep fatigue。", "vocab": "sleep disorder (n. phr.) 睡眠障礙，睡眠失調；lie awake (v. phr.) 醒著躺在床上。"}, {"number": 8, "part": "", "question": "Driving for six hours without any rest caused severe ________, making the driver feel dizzy and unable to focus on the road.", "answer": "(E) fatigue", "explanation": "連續駕駛六小時沒有休息導致嚴重的「疲勞（severe fatigue）」，使駕駛頭暈且無法專注於路況，需填名詞 (E) fatigue。(A) workout 是主動運動，無法由「不休息開車」引起。", "vocab": "fatigue (n.) 疲憊，勞累（不可數名詞）；dizzy (adj.) 頭暈的；focus on (v. phr.) 專注於。"}, {"number": 9, "part": "", "question": "The dentist gave him an injection before pulling the tooth, but as the medicine began to ________, his mouth started to ache again.", "answer": "(K) wear off", "explanation": "the medicine began to ___，需填原形不及物動詞片語。拔牙前打了麻醉針，但隨著藥效開始「消退（wear off）」，嘴巴又開始隱隱作痛，故選 (K) wear off。", "vocab": "wear off (v. phr.) （藥效、麻醉感等）消退，逐漸消失；injection (n.) 注射，打針；ache (v./n.) 疼痛。"}, {"number": 10, "part": "", "question": "After doing an intense 45-minute ________ involving running and lifting weights, David drank plenty of water and stretched his sore muscles.", "answer": "(A) workout", "explanation": "不定冠詞 an 與形容詞 intense 45-minute 之後需填單數名詞。包含跑步與舉重（involving running and lifting weights），指 45 分鐘高強度的「鍛鍊／體能訓練」，故選 (A) workout。", "vocab": "workout (n.) 體能鍛鍊，健身；lift weights (v. phr.) 舉重；sore muscles (n. phr.) 肌肉痠痛。"}, {"number": 11, "part": "", "question": "She walked twenty kilometers up the mountain with a heavy backpack, so by evening she was completely ________ and fell asleep immediately.", "answer": "(H) exhausted", "explanation": "was completely ___ 後接 and fell asleep immediately（立刻睡著），需填形容詞作主詞補語。背著重背包爬了二十公里山路，到傍晚已經「筋疲力竭的」，故選 (H) exhausted。(J) inevitable（必然的）與 (P) rewarding（有收穫的）無法搭配人作完全疲憊的主詞補語。", "vocab": "exhausted (adj.) 筋疲力竭的；completely (adv.) 徹底地；fall asleep (v. phr.) 入睡。"}, {"number": 12, "part": "", "question": "Volunteering to teach English at the rural school took a lot of effort, but seeing the children smile made it a truly ________ experience.", "answer": "(P) rewarding", "explanation": "a truly ___ experience 需填形容詞修飾 experience。偏鄉志工教英語雖然辛苦，但看到孩子們的笑容讓這成為一次真正「有意義且回饋豐厚的（rewarding）」經驗，故選 (P) rewarding。(C) profitable 指金錢盈利，志工服務無酬故不適用。", "vocab": "rewarding (adj.) 值得的，有回報的，有意義的；volunteer (v.) 當志工；rural school (n. phr.) 偏鄉學校。"}, {"number": 13, "part": "", "question": "If you never study or do your homework before exams, poor grades are almost ________.", "answer": "(J) inevitable", "explanation": "poor grades are almost ___，需填形容詞作補語。如果考前從不讀書也不寫作業，成績很差幾乎是「不可避免的、必然的」，故選 (J) inevitable。", "vocab": "inevitable (adj.) 不可避免的，必然的；poor grades (n. phr.) 差勁的成績。"}, {"number": 14, "part": "", "question": "Every evening before bedtime, Tina likes to ________ thirty minutes for reading so that she can relax without looking at her phone.", "answer": "(B) set aside", "explanation": "likes to 後接時間受詞 thirty minutes 與用途 for reading，需填原形及物動詞片語。每晚睡前 Tina 喜歡「撥出、留出（set aside）」三十分鐘來閱讀，故選 (B) set aside。", "vocab": "set aside (v. phr.) 撥出（時間），保留（金錢等）；bedtime (n.) 就寢時間。"}, {"number": 15, "part": "", "question": "Since her apartment bedroom is very small, she bought a(n) ________ folding desk that fits easily into the corner without taking up much space.", "answer": "(M) compact", "explanation": "修飾 folding desk（折疊桌），後半句提到能輕鬆塞進角落且不佔太多空間（without taking up much space），可知桌子是「小型緊湊的、精巧的」，故選 (M) compact。(C) profitable（賺錢的）修飾桌子語意不合。", "vocab": "compact (adj.) 小型緊湊的，精巧不佔空間的；folding desk (n. phr.) 折疊桌；take up space (v. phr.) 佔據空間。"}]}, {"name": "III. Fill-in-gaps（文意選填：40%，每題 1%）", "parts": [{"name": "第一篇（第 1–10 題：德奧背包客之旅）", "intro": ["(A) break (n.) 中斷、破裂", "(B) crossed into (v. phr. pt) 跨入、越境進入", "(C) lively (adj.) 熱鬧生動的", "(D) notes (n., pl.) 音符", "(E) painted (v. pp/adj.) 被漆成……的", "(F) pushed on (v. phr. pt) 繼續前行、挺進", "(G) ride (n.) 搭乘、主題樂園遊樂設施", "(H) rising (v. pres. part.) 高聳矗立的", "(I) stretch (n.) 一段路程、一段時間", "(J) trading (v. pres. part.) 換成（trade A for B）"]}, {"name": "第二篇（第 11–20 題：餐廳環境心理學與顧客行為）", "intro": ["(K) absence (n.) 缺少、不存在", "(L) dig in (v. phr.) 開始大快朵頤、開吃", "(M) layout (n.) 室內格局、配置", "(N) linger over (v. phr.) 慢慢享用、在……上流連", "(O) lit (v. pp/adj.) 被照亮的（dimly lit 昏暗照明的）", "(P) self-conscious (adj.) 不自在的、顧慮旁人眼光的", "(Q) shape (v.) 塑造、影響", "(R) space (n.) 版面、空間", "(S) uncomfortable (adj.) 身體不舒服的", "(T) upbeat (adj.) 歡快的、快節奏的"]}], "questions": [{"number": 1, "part": "第一篇（第 1–10 題：德奧背包客之旅）", "question": "My first stop was Munich, a historic city where centuries-old stone architecture and a(n) (1) _______ street culture sit comfortably side by side.", "answer": "(C) lively", "explanation": "修飾名詞 street culture（街頭文化），需填形容詞。慕尼黑是數百年歷史石造建築與「熱鬧生動的」街頭文化並存的城市，故選 (C) lively。", "vocab": "lively (adj.) 熱鬧的，精力充沛的；centuries-old (adj.) 數百年歷史的。"}, {"number": 2, "part": "第一篇（第 1–10 題：德奧背包客之旅）", "question": "An electric boat carried us peacefully across the glassy water, with towering mountains (2) _______ sharply on both sides.", "answer": "(H) rising", "explanation": "with + 受詞 (towering mountains) + 分詞補語。山脈在兩側高聳矗立，主動關係且不及物動詞用現在分詞，故選 (H) rising。", "vocab": "towering (adj.) 高聳的；sharply (adv.) 陡峭地，急劇地。"}, {"number": 3, "part": "第一篇（第 1–10 題：德奧背包客之旅）", "question": "Midway through the ride, the boat captain blew a trumpet, and the clear musical (3) _______ bounced off the massive rock faces in distinct echoes.", "answer": "(D) notes", "explanation": "形容詞 clear musical 之後需填複數名詞。船長吹小號發出清脆的「音符」，撞擊岩壁產生回音，故選 (D) notes。", "vocab": "musical notes (n. phr.) 音符；bounce off (v. phr.) 從……反彈。"}, {"number": 4, "part": "第一篇（第 1–10 題：德奧背包客之旅）", "question": "From southern Germany, I soon (4) _______ Austria and spent a pleasant afternoon wandering Salzburg.", "answer": "(B) crossed into", "explanation": "從南德出發，很快「跨入、進入」奧地利境內，需填過去式動詞片語，故選 (B) crossed into。", "vocab": "cross into (v. phr.) 跨入（國界/邊境）；wander (v.) 漫步。"}, {"number": 5, "part": "第一篇（第 1–10 題：德奧背包客之旅）", "question": "Eager to explore further, I then (5) _______ to the famous lakeside village of Hallstatt.", "answer": "(F) pushed on", "explanation": "渴望進一步探索，接著「繼續挺進、前行」前往哈修塔特湖畔小鎮，需填過去式動詞片語，故選 (F) pushed on。", "vocab": "push on (v. phr.) 繼續前進，奮力前行；lakeside village (n. phr.) 湖畔村落。"}, {"number": 6, "part": "第一篇（第 1–10 題：德奧背包客之旅）", "question": "Speeding down those tracks turned the educational tour into an exciting theme park (6) _______, making the dead quiet of the tunnels feel completely surreal.", "answer": "(G) ride", "explanation": "不定冠詞 an 與名詞片語 theme park 之後需填單數名詞。在鹽礦長木滑道快速下滑，把教育導覽變成了刺激的主題樂園「遊樂設施／滑車」，故選 (G) ride。", "vocab": "theme park ride (n. phr.) 主題樂園遊樂設施；surreal (adj.) 超現實的。"}, {"number": 7, "part": "第一篇（第 1–10 題：德奧背包客之旅）", "question": "I later boarded a modern train for the final (7) _______ of my long journey to Vienna.", "answer": "(I) stretch", "explanation": "the final ___ of my long journey，需填名詞。登上現代化火車，踏上前往維也納長途旅程的「最後一段路程」，stretch 可指一段連貫的路途或時間，故選 (I) stretch。", "vocab": "the final stretch (n. phr.) 最後一段路程；board (v.) 登上（火車、飛機）。"}, {"number": 8, "part": "第一篇（第 1–10 題：德奧背包客之旅）", "question": "The scenery shifted noticeably outside the window, (8) _______ rugged alpine peaks for the flatter ground of the east.", "answer": "(J) trading", "explanation": "逗號後分詞構句修飾風景轉變，trade A for B 意為「將 A 換成 B」，把崎嶇山峰換成了東部平坦地貌，故選 (J) trading。", "vocab": "trade A for B (v. phr.) 將 A 換成 B；rugged (adj.) 崎嶇的。"}, {"number": 9, "part": "第一篇（第 1–10 題：德奧背包客之旅）", "question": "In the capital, I admired unusual apartment buildings (9) _______ in bright, bold colors.", "answer": "(E) painted", "explanation": "名詞 apartment buildings 後方過去分詞後位修飾，指「被漆成」鮮豔色彩的公寓大樓，故選 (E) painted。", "vocab": "bold colors (n. phr.) 鮮明大膽的顏色；admire (v.) 欣賞。"}, {"number": 10, "part": "第一篇（第 1–10 題：德奧背包客之旅）", "question": "Traveling by rail made each departure feel like a smooth continuation of my travels rather than a sudden (10) _______ from them.", "answer": "(A) break", "explanation": "rather than 連接前後對比名詞：a smooth continuation（流暢的延續）對比 a sudden break（突兀的中斷／脫節），故選 (A) break。", "vocab": "a sudden break from... (n. phr.) 與……突兀的脫節/中斷；continuation (n.) 延續。"}, {"number": 11, "part": "第二篇（第 11–20 題：餐廳環境心理學與顧客行為）", "question": "However, every subtle detail, from the ambient lighting to the interior (11) _______, is rarely accidental.", "answer": "(M) layout", "explanation": "與 ambient lighting（環境照明）並列的室內設計要素，the interior layout 指「室內空間配置／格局」，故選 (M) layout。", "vocab": "interior layout (n. phr.) 室內格局；ambient lighting (n. phr.) 環境照明。"}, {"number": 12, "part": "第二篇（第 11–20 題：餐廳環境心理學與顧客行為）", "question": "Indeed, dining establishments draw on various psychological techniques to (12) _______ customer experience and boost spending.", "answer": "(Q) shape", "explanation": "不定詞 to 後接受詞 customer experience（顧客體驗），需填原形及物動詞。運用心理技巧來「塑造、影響」顧客體驗，故選 (Q) shape。", "vocab": "shape (v.) 塑造，決定；dining establishment (n. phr.) 餐飲場所；boost spending (v. phr.) 刺激消費。"}, {"number": 13, "part": "第二篇（第 11–20 題：餐廳環境心理學與顧客行為）", "question": "For instance, fast-food chains deliberately feature red and yellow decor because these warm shades make patrons (13) _______ quickly and leave sooner.", "answer": "(L) dig in", "explanation": "使役動詞 make + 受詞 patrons + 原形動詞補語。暖色調讓顧客快點「開動、大快朵頤（dig in）」並儘早離開，故選 (L) dig in。", "vocab": "dig in (v. phr.) 開始大吃，開動；deliberately (adv.) 故意地，刻意地。"}, {"number": 14, "part": "第二篇（第 11–20 題：餐廳環境心理學與顧客行為）", "question": "Since diners naturally scan the top-right corner first, restaurants often set aside that prime (14) _______ for their most profitable dishes.", "answer": "(R) space", "explanation": "that prime ___ 需填名詞。顧客視線首先掃描菜單右上角，因此餐廳將那個黃金「版面／位置（prime space）」留給利潤最高的餐點，故選 (R) space。", "vocab": "prime space (n. phr.) 黃金位置，優勢版面；profitable (adj.) 獲利的。"}, {"number": 15, "part": "第二篇（第 11–20 題：餐廳環境心理學與顧客行為）", "question": "Moreover, the total (15) _______ of dollar signs prompts guests to focus on delicious dishes rather than the actual cost.", "answer": "(K) absence", "explanation": "the total ___ of dollar signs，需填名詞。菜單上完全「不放／去除」金錢符號「$」，能促使顧客專注於美食而非實際花費，故選 (K) absence（absence of... 缺少……）。", "vocab": "the absence of... (n. phr.) ……的缺乏/不復存在（反義詞：presence）；prompt sb. to V (v. phr.) 促使某人做……。"}, {"number": 16, "part": "第二篇（第 11–20 題：餐廳環境心理學與顧客行為）", "question": "While gentle melodies encourage people to stay longer, (16) _______, loud music accelerates eating and promotes rapid table turnover during rush hours.", "answer": "(T) upbeat", "explanation": "與 loud music 並列修飾音樂，需填形容詞。前半句柔和旋律讓人久留，後半句「歡快節奏的（upbeat）」大聲音樂則加速進食與翻桌率，故選 (T) upbeat。", "vocab": "upbeat (adj.) 歡快的，快節奏的；table turnover (n. phr.) 翻桌率。"}, {"number": 17, "part": "第二篇（第 11–20 題：餐廳環境心理學與顧客行為）", "question": "The hard stools in fast-food outlets are intentionally designed to make guests physically (17) _______ after twenty minutes, nudging them out the door.", "answer": "(S) uncomfortable", "explanation": "make guests physically ___ 需填形容詞作受詞補語。速食店的硬椅刻意設計讓顧客在二十分鐘後身體感到「不舒服」，順勢把他們請出門，故選 (S) uncomfortable。", "vocab": "uncomfortable (adj.) 不舒服的；nudge sb. out (v. phr.) 輕推某人出去。"}, {"number": 18, "part": "第二篇（第 11–20 題：餐廳環境心理學與顧客行為）", "question": "Upscale venues, by contrast, provide plush chairs that invite visitors to relax and slowly (18) _______ their dessert.", "answer": "(N) linger over", "explanation": "to relax and slowly ___ their dessert，需填原形及物動詞片語。高級場所提供舒適沙發椅，邀請客人放鬆並慢慢「享用、品味（linger over）」甜點，故選 (N) linger over。", "vocab": "linger over (v. phr.) 慢條斯理地享用/品味；upscale venue (n. phr.) 高檔場所。"}, {"number": 19, "part": "第二篇（第 11–20 題：餐廳環境心理學與顧客行為）", "question": "Studies reveal that patrons eating in dimly (19) _______ environments consistently order richer meals.", "answer": "(O) lit", "explanation": "副詞 dimly（昏暗地）後接過去分詞修飾 environments（環境），dimly lit environments 為固定複合形容詞搭配，意為「燈光昏暗的環境」，故選 (O) lit（light 的過去分詞）。", "vocab": "dimly lit (adj. phr.) 光線昏暗的；consistently (adv.) 一貫地。"}, {"number": 20, "part": "第二篇（第 11–20 題：餐廳環境心理學與顧客行為）", "question": "The soothing shadows make diners feel relaxed and far less (20) _______ about their food choices, encouraging them to indulge without hesitation.", "answer": "(P) self-conscious", "explanation": "feel relaxed and far less ___ about... 需填形容詞作補語。柔和陰影使人放鬆，且對自己的高熱量飲食選擇「不那麼顧慮旁人眼光／不那麼不自在」，放膽盡情享用，故選 (P) self-conscious。", "vocab": "self-conscious (adj.) 顧忌形象的，不自在的；indulge without hesitation (phr.) 毫不猶豫地縱情享受。"}]}], "answerTable": [["大題", "題號與標準答案"], ["II. Vocabulary (30%)", "1. (D) departure / 2. (I) subtle / 3. (L) placement / 4. (F) cushion / 5. (O) indulge / 6. (G) draw upon / 7. (N) disorder / 8. (E) fatigue / 9. (K) wear off / 10. (A) workout / 11. (H) exhausted / 12. (P) rewarding / 13. (J) inevitable / 14. (B) set aside / 15. (M) compact"], ["III. Fill-in-gaps Part 1 (1–10)", "1. (C) lively / 2. (H) rising / 3. (D) notes / 4. (B) crossed into / 5. (F) pushed on / 6. (G) ride / 7. (I) stretch / 8. (J) trading / 9. (E) painted / 10. (A) break"], ["III. Fill-in-gaps Part 2 (11–20)", "11. (M) layout / 12. (Q) shape / 13. (L) dig in / 14. (R) space / 15. (K) absence / 16. (T) upbeat / 17. (S) uncomfortable / 18. (N) linger over / 19. (O) lit / 20. (P) self-conscious"]]}}</script><script>
'use strict';const DATA=JSON.parse(document.getElementById('data').textContent);const E=id=>document.getElementById(id);let exam='1028',s=0,n=0;function fill(el,items,valfn,textfn){el.replaceChildren();items.forEach((x,i)=>{const opt=document.createElement('option');opt.value=valfn(x,i);opt.textContent=textfn(x,i);el.appendChild(opt)})}function drawExam(){const d=DATA[exam];E('source').textContent=d.source;fill(E('section'),d.sections,(_,i)=>i,x=>x.name);const tb=E('summary');tb.replaceChildren();d.answerTable.forEach((row,i)=>{const tr=document.createElement('tr');row.forEach(v=>{const el=document.createElement(i?'td':'th');el.textContent=v;tr.appendChild(el)});tb.appendChild(tr)});s=0;drawSection()}
function drawSection(){const sec=DATA[exam].sections[s];fill(E('number'),sec.questions,x=>x.number,x=>'第 '+x.number+' 題');n=0;drawQuestion()}
function drawQuestion(){const sec=DATA[exam].sections[s],q=sec.questions[n];E('section').value=String(s);E('number').value=String(q.number);E('heading').textContent=sec.name;E('counter').textContent=`第 ${q.number} 題 · ${n+1}/${sec.questions.length}`;E('part').textContent=q.part||'';for(const [id,key] of [['questionText','question'],['answerText','answer'],['explanationText','explanation'],['vocabText','vocab']])E(id).textContent=q[key]||'（原始檔案未提供）';const part=sec.parts.find(x=>x.name===q.part&&x.intro.length)||sec.parts.find(x=>x.intro.length);E('wordbank').hidden=!part;E('wordbank').open=false;E('intro').textContent=part?part.intro.join('\n'):'';E('prev').disabled=n===0;E('next').disabled=n===sec.questions.length-1}
E('exam').addEventListener('change',e=>{exam=e.target.value;drawExam()});E('section').addEventListener('change',e=>{s=Number(e.target.value);drawSection()});E('number').addEventListener('change',e=>{n=DATA[exam].sections[s].questions.findIndex(x=>String(x.number)===e.target.value);drawQuestion()});function step(delta){n+=delta;drawQuestion();E('questionPanel').scrollIntoView({behavior:'smooth',block:'start'})}E('prev').addEventListener('click',()=>step(-1));E('next').addEventListener('click',()=>step(1));drawExam();
</script></body></html>
